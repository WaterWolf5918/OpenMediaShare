
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenMediaShare</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />

</head>
<body>
    <template id="provider-tenplate">
        <div class="provider">
            <div class="provider-image"><img></div>
            <div class="provider-state"><span class="material-symbols-rounded">play_arrow</span></div>
            <div class="provider-name"><p>Spicetify Client</p></div>
            <div class="provider-current-title"><p>KAMELEON<br>Kami Kehoe</p></div>
            <div class="provider-service"><p>spicetify</p></div>
            <div class="provider-ip"><p>::1</p></div>
            <div class="provider-uuid"><p>b171afd2-5741-462f-87d2-53a928de8676</p></div>
        </div>
    </template>

    <template id="settings-unknown-tenplate">
        <div class="settings-option">
            <p class="settings-label">label</p>
        </div>
    </template>

    <template id="settings-toggle-tenplate">
        <div class="settings-option">
            <p class="settings-label">label</p>
            <label class="toggle-swtich">
                <input type="checkbox">
                <span class="toggle-switch-slider"></span>
            </label>
        </div>
    </template>
    

    <template id="settings-text-tenplate">
        <div class="settings-option settings-text">
            <p class="settings-label">label</p>
            <input type="text" placeholder="text" class="settings-input settings-text-input">
        </div>
    </template>

    
    <template id="settings-number-tenplate">
        <div class="settings-option settings-text">
            <p class="settings-label">label</p>
            <input type="number" placeholder="0000" class="settings-input settings-number-input">
        </div>
    </template>

    <template id="settings-range-tenplate">
        <div class="settings-option settings-text">
            <p class="settings-label">label</p>
            <input type="range" class="settings-input">
            <input type="number" placeholder="0000" class="settings-input settings-number-input">
        </div>
    </template>

    <template id="settings-color-tenplate">
        <div class="settings-option settings-text">
            <p class="settings-label">label</p>
            <input type="color" class="settings-input settings-color-input">
        </div>
    </template>


    <template id="plugin-tenplate">
        <div class="plugin">
            <div class="plugin-topbar">
                <span class="plugin-name">Very advanced plugin</span>
                <div class="plugin-topbar-right">
                    <span class="material-symbols-rounded plugin-settings-btn">settings</span>
                    <label class="toggle-swtich">
                        <input type="checkbox">
                        <span class="toggle-switch-slider"></span>
                    </label>
                </div>

            </div>
            <div class="plugin-desc">
                <p class="plugin-desc">A helpful description of your plugin.</p>
            </div>
        </div>
    </template>


    <div class="content">
        <div class="sidebar">
            <div class="sidebar-button hidden" id="back">
                <span class="material-symbols-rounded">undo</span>
                <p>Back</p>
            </div>

            <div class="sidebar-button active-sidebar-button" id="home">
                <span class="material-symbols-rounded">home</span>
                <p>Home</p>
            </div>

            <div class="sidebar-button" id="plugins">
                <span class="material-symbols-rounded">extension</span>
                <p>Plugins</p>
            </div>

            <div class="sidebar-button" id="settings">
                <span class="material-symbols-rounded">settings</span>
                <p>Settings</p>
            </div>
        </div>

        <div class="page home-content active-page" id="home-content">
            <div class="provider provider-header">
                <div class="provider-image"><p>Image</p></div>
                <div class="provider-state"><p>State</p></div>
                <div class="provider-name"><p>Name</p></div>
                <div class="provider-current-title"><p>Current Title</p></div>
                <div class="provider-service"><p>Service</p></div>
                <div class="provider-ip"><p>IP</p></div>
                <div class="provider-uuid"><p>UUID</p></div>
            </div>
            <div id="provider-table" class="provider-table">

            </div>

        </div>

        <div class="page plugins-content" id="plugins-content">
            <div id="plugins-list" class="plugins-list">

            </div>
            <div id="plugin-settings" class="settings-content">

            </div>
        </div>

        <div class="page settings-content" id="settings-content">

        </div>
    </div>

    <script type="module" src="/src/renderer.ts"></script>
</body>
</html>
